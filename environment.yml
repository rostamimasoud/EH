# Reproducible environment for the shallow-time Earth Habitability pipeline.
#
# Build on the PIK HPC (after `module load anaconda/2025`):
#     conda env create -f environment.yml -p ./envs/eh
#     conda activate ./envs/eh
#
# FaIR is intentionally omitted so the climate core is the deterministic two-box
# forward-Euler solver (bit-reproducible across machines); add it (pip install
# fair) for the exact matrix-exponential core.
name: eh
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26,<2.1
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - cartopy>=0.22
  - regionmask>=0.11
  - shapely>=2.0
  - requests>=2.31
  - pip>=23
  - pip:
      - PyCO2SYS>=1.8
