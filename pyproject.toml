[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eh-shallow"
version = "0.1.0"
description = "Shallow-time Earth Habitability: reduced, calibrated climate-ocean pipeline to a spatial Composite Hazard Score and Habitable Area Fraction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Masoud Rostami" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "regionmask>=0.9",
    "PyCO2SYS>=1.8",
]

[project.optional-dependencies]
# Optional, improves fidelity: FaIR gives the exact matrix-exponential climate
# core (forward-Euler two-box fallback otherwise); cartopy makes the CHS map a
# Robinson projection with coastlines (plain pcolormesh otherwise); rasterio and
# netCDF4 are only needed for the raw WHI raster / validation modules.
extras = ["fair>=2.2", "cartopy>=0.22", "rasterio>=1.3", "netCDF4>=1.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eh_shallow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
